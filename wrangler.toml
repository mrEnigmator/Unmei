name = "unmei"
compatibility_date = "2026-05-01"
pages_build_output_dir = "."

# Binding KV — przestrzeń na zdarzenia ze strony zaproszenia.
# Po utworzeniu przestrzeni KV wklej tutaj jej identyfikator:
#   npx wrangler kv namespace create ZAPROSZENIE
[[kv_namespaces]]
binding = "ZAPROSZENIE"
id = "WSTAW_TUTAJ_ID_PRZESTRZENI_KV"

# Sekret ADMIN_HASLO NIE trafia do tego pliku.
# Ustaw go w dashboardzie (Settings → Environment variables, typ: Secret)
# albo przez: npx wrangler pages secret put ADMIN_HASLO --project-name unmei
